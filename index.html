<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓國・釜山・慶州 五日漫遊</title>
    <style>
        :root {
            --bg-color: #fdf8f1;
            --primary-blue: #a3c4f3;
            --primary-orange: #ffd1a4;
            --primary-green: #c1e1c1;
            --primary-purple: #dcd3ff;
            --text-color: #555;
            --gray-text: #ccc;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 40px 0;
            background: linear-gradient(135deg, #a3c4f3 0%, #ffd1a4 100%);
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 26px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 25px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid white;
            margin: 10px 0;
        }

        .date-nav {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            overflow-x: auto;
            padding: 10px;
            width: 90%;
            justify-content: flex-start;
        }

        @media (min-width: 768px) {
            .date-nav { justify-content: center; }
        }

        .date-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            white-space: nowrap;
        }

        .date-btn.active {
            background-color: var(--primary-blue);
            color: white;
        }

        .content-card {
            background: white;
            width: 85%;
            max-width: 500px;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.03);
            display: none;
            margin-bottom: 30px;
        }

        .content-card.active { display: block; }

        .checklist-group { margin-bottom: 20px; }
        .check-item { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .check-item input { width: 18px; height: 18px; margin-right: 10px; }
        .check-item input:checked + span { text-decoration: line-through; color: var(--gray-text); }

        .weather-info { background: #f0f7ff; padding: 10px; border-radius: 15px; margin-bottom: 15px; font-size: 14px; }
        .itinerary-list { list-style: none; padding: 0; }
        .itinerary-list li { margin-bottom: 10px; display: flex; align-items: center; }
        footer { margin-top: auto; padding: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

    <header>
        <p>SEOUL・BUSAN・GYEONGJU</p>
        <h1>✈️ 釜山慶州・趣旅行</h1>
    </header>

    <div class="date-nav">
        <button class="date-btn active" onclick="showDay(0)">📋 行前清單</button>
        <button class="date-btn" onclick="showDay(1)">5/15(五)</button>
        <button class="date-btn" onclick="showDay(2)">5/16(六)</button>
        <button class="date-btn" onclick="showDay(3)">5/17(日)</button>
        <button class="date-btn" onclick="showDay(4)">5/18(一)</button>
        <button class="date-btn" onclick="showDay(5)">5/19(二)</button>
    </div>

    <div id="day0" class="content-card active">
        <h3>🎒 行前打包清單</h3>
        <div class="checklist-group">
            <label class="check-item"><input type="checkbox"><span>護照、現金、信用卡</span></label>
            <label class="check-item"><input type="checkbox"><span>雨傘、轉接插頭</span></label>
            <label class="check-item"><input type="checkbox"><span>手機充電線 *2</span></label>
        </div>
        <div class="checklist-group">
            <label class="check-item"><input type="checkbox"><span>防曬用品、保冰袋</span></label>
            <label class="check-item"><input type="checkbox"><span>盥洗用品、化妝品</span></label>
        </div>
    </div>

    <div id="day1" class="content-card">
        <div class="weather-info">☀️ 預測：18°C - 24°C</div>
        <h3>慶州韓屋漫遊</h3>
        <ul class="itinerary-list">
            <li><span>✈️</span> 桃園 → 金海機場</li>
            <li><span>♨️</span> 韓式汗蒸幕</li>
            <li><span>⛩️</span> 慶州崔氏古宅</li>
        </ul>
    </div>

    <div id="day2" class="content-card"><div class="weather-info">🌤️ 19°C - 23°C</div><h3>釜山樂園暢遊</h3></div>
    <div id="day3" class="content-card"><div class="weather-info">☁️ 17°C - 21°C</div><h3>海雲台夜景</h3></div>
    <div id="day4" class="content-card"><div class="weather-info">☀️ 20°C - 25°C</div><h3>白淺灘文化村</h3></div>
    <div id="day5" class="content-card"><div class="weather-info">🌦️ 18°C - 22°C</div><h3>甘川洞歸途</h3></div>

    <footer>✨ 2026 釜山旅程計畫 ✈️</footer>

    <script>
        function showDay(num) {
            const cards = document.querySelectorAll('.content-card');
            const btns = document.querySelectorAll('.date-btn');
            cards.forEach(c => c.style.display = 'none');
            btns.forEach(b => b.classList.remove('active'));
            
            document.getElementById('day' + num).style.display = 'block';
            btns[num].classList.add('active');
        }
    </script>
</body>
</html>
