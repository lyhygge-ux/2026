<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓國・釜山・慶州 五日漫遊</title>
    <style>
        :root {
            --bg-color: #fdf8f1;
            --primary-blue: #a3c4f3;
            --primary-orange: #ffd1a4;
            --primary-green: #c1e1c1;
            --primary-purple: #dcd3ff;
            --text-color: #555;
            --gray-text: #ccc;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 🎨 可愛標題區 */
        header {
            width: 100%;
            padding: 40px 0;
            background: linear-gradient(135deg, #a3c4f3 0%, #ffd1a4 100%);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header::before {
            content: "☁️ ✈️ 🌍 🎒 📸 ⛵";
            position: absolute;
            font-size: 24px;
            width: 120%;
            top: 10px;
            left: -10%;
            opacity: 0.3;
            letter-spacing: 50px;
            animation: moveClouds 20s linear infinite;
        }

        @keyframes moveClouds {
            from { transform: translateX(-10%); }
            to { transform: translateX(10%); }
        }

        header h1 {
            font-size: 26px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 30px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid white;
            margin-top: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* 日期導覽列 */
        .date-nav {
            display: flex;
            gap: 10px;
            margin: 25px 0;
            overflow-x: auto;
            padding: 10px;
            width: 95%;
            justify-content: flex-start;
        }

        @media (min-width: 768px) {
            .date-nav { justify-content: center; }
        }

        .date-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            white-space: nowrap;
            color: var(--text-color);
        }

        .date-btn.active {
            background-color: var(--primary-blue);
            color: white;
        }

        /* 行程內容卡片 */
        .content-card {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.03);
            display: none;
